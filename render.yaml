# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys BrainTriage as a single Docker service (see Dockerfile at repo
# root): the container builds the React frontend and serves it directly
# from the FastAPI backend, so there's exactly one URL and no CORS setup.
#
# To deploy: render.com -> New + -> Blueprint -> connect this repo. Render
# may prompt for the two `sync: false` vars below — both are optional and
# safe to leave blank; see the comments on each.
services:
  - type: web
    name: braintriage
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # Optional — the CSF biomarker cohort downloads anonymously from its
      # public Kaggle listing at container start (verified working with no
      # credentials at all), so this is only a fallback in case Kaggle ever
      # rate-limits/blocks anonymous access from this platform's IP range.
      # Get a value from https://www.kaggle.com/settings -> API Tokens ->
      # Generate New Token if you need to set it — paste it straight into
      # this field, never into a screenshot or chat.
      - key: KAGGLE_API_TOKEN
        sync: false
      # Optional — leave unset to ship with the AI Assistant tab showing
      # its "not configured" setup card instead of live chat. Only set
      # this if you're comfortable with a public link being able to spend
      # against this key; there's no per-visitor rate limiting.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Public demo credentials — intentionally shared (see the "Continue
      # as Demo Admin" button on the login page). Change these if you want
      # this deployment to be less than fully public.
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: braintriage2026
      - key: JWT_SECRET
        generateValue: true
